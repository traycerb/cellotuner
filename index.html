<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cello Tuner</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #10b981;
      --warn: #f59e0b;
      --bad: #ef4444;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px 24px;
      overflow: hidden;
      transition: background-color 0.25s ease;
    }

    body.in-tune-bg {
      background-color: #064e3b;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #475569;
    }
    .status-dot.active {
      background: var(--good);
      box-shadow: 0 0 8px var(--good);
    }

    .level-bar {
      width: 40px;
      height: 7px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
    }
    .level-fill {
      height: 100%;
      width: 0%;
      background: var(--good);
      transition: width 0.05s linear;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pill-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .gauge-container {
      width: 100%;
      max-width: 480px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    svg.gauge {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .needle {
      transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform-origin: 200px 190px;
    }

    .readout {
      text-align: center;
      margin-top: -12px;
    }

    .note-display {
      font-size: clamp(4.5rem, 15vw, 6.8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      transition: color 0.15s;
    }

    .note-display.in-tune {
      color: var(--good);
      text-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
    }

    .octave-sub {
      font-size: 0.45em;
      font-weight: 600;
      color: var(--muted);
      margin-left: 2px;
    }

    .cents-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 18px;
      border-radius: 999px;
      background: var(--panel);
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .hz-display {
      margin-top: 6px;
      font-size: 1rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .tuning-hint {
      margin-top: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      height: 1.5rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    footer {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .footer-label {
      text-align: center;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .string-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .string-btn {
      background: var(--panel);
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 14px 8px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .string-btn.target-highlight {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
    }

    .string-btn.playing {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.5);
    }

    .string-btn .s-note {
      font-size: 1.75rem;
      font-weight: 800;
    }

    .string-btn .s-hz {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 2px;
    }

    .string-btn .s-icon {
      font-size: 0.75rem;
      margin-top: 6px;
      font-weight: 600;
      opacity: 0.85;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }

    #start-overlay.hidden {
      display: none;
    }

    .start-card {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .start-card h1 {
      font-size: 2.1rem;
      margin-bottom: 12px;
    }

    .start-card p {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 28px;
      font-size: 1.05rem;
    }

    .start-btn {
      background: var(--good);
      color: #052e16;
      border: none;
      border-radius: 16px;
      padding: 18px 32px;
      font-size: 1.35rem;
      font-weight: 800;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
    }

    .error-msg {
      color: var(--bad);
      margin-top: 16px;
      font-size: 0.95rem;
      display: none;
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <div class="start-card">
      <h1>Cello Tuner</h1>
      <p>Tap below to activate your microphone for pitch detection.</p>
      <button class="start-btn" id="start-btn">Tap to Start Tuning</button>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

  <header>
    <div class="brand">
      <div class="status-container" title="Audio Input Level">
        <div class="status-dot" id="mic-dot"></div>
        <div class="level-bar"><div class="level-fill" id="level-fill"></div></div>
      </div>
      <span>Cello Tuner</span>
    </div>
    <div class="controls">
      <button class="pill-btn active" id="mode-btn">Cello Lock</button>
      <button class="pill-btn" id="cal-btn">A = 440 Hz</button>
    </div>
  </header>

  <main>
    <div class="gauge-container">
      <svg class="gauge" viewBox="0 0 400 210">
        <path d="M 35 160 A 170 170 0 0 1 365 160" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
        <path d="M 185 20.6 A 170 170 0 0 1 215 20.6" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="butt"/>

        <g stroke="#64748b" stroke-width="2">
          <line x1="200" y1="8" x2="200" y2="28" stroke="#10b981" stroke-width="4"/>
          <line x1="200" y1="12" x2="200" y2="26" transform="rotate(-15 200 190)"/>
          <line x1="200" y1="12" x2="200" y2="26" transform="rotate(-30 200 190)"/>
          <line x1="200" y1="10" x2="200" y2="28" transform="rotate(-45 200 190)" stroke-width="3"/>
          <line x1="200" y1="12" x2="200" y2="26" transform="rotate(-60 200 190)"/>
          <line x1="200" y1="8"  x2="200" y2="28" transform="rotate(-75 200 190)" stroke-width="3"/>

          <line x1="200" y1="12" x2="200" y2="26" transform="rotate(15 200 190)"/>
          <line x1="200" y1="12" x2="200" y2="26" transform="rotate(30 200 190)"/>
          <line x1="200" y1="10" x2="200" y2="28" transform="rotate(45 200 190)" stroke-width="3"/>
          <line x1="200" y1="12" x2="200" y2="26" transform="rotate(60 200 190)"/>
          <line x1="200" y1="8"  x2="200" y2="28" transform="rotate(75 200 190)" stroke-width="3"/>
        </g>

        <text x="35" y="190" fill="#64748b" font-size="13" font-weight="700" text-anchor="middle">♭ FLAT</text>
        <text x="365" y="190" fill="#64748b" font-size="13" font-weight="700" text-anchor="middle">SHARP ♯</text>

        <g class="needle" id="needle" transform="rotate(0)">
          <line x1="200" y1="190" x2="200" y2="22" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" id="needle-line"/>
          <circle cx="200" cy="190" r="12" fill="#f8fafc"/>
        </g>
      </svg>

      <div class="readout">
        <div class="note-display" id="note-el">--</div>
        <div class="cents-badge" id="cents-el">Play a string</div>
        <div class="hz-display" id="hz-el">0.0 Hz</div>
        <div class="tuning-hint" id="hint-el"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-label">Tap a string for bowed reference tone</div>
    <div class="string-grid" id="string-grid">
      <button class="string-btn" data-idx="0">
        <span class="s-note">C<small>2</small></span>
        <span class="s-hz" id="str-hz-0">65.4 Hz</span>
        <span class="s-icon">🔊 Tone</span>
      </button>
      <button class="string-btn" data-idx="1">
        <span class="s-note">G<small>2</small></span>
        <span class="s-hz" id="str-hz-1">98.0 Hz</span>
        <span class="s-icon">🔊 Tone</span>
      </button>
      <button class="string-btn" data-idx="2">
        <span class="s-note">D<small>3</small></span>
        <span class="s-hz" id="str-hz-2">146.8 Hz</span>
        <span class="s-icon">🔊 Tone</span>
      </button>
      <button class="string-btn" data-idx="3">
        <span class="s-note">A<small>3</small></span>
        <span class="s-hz" id="str-hz-3">220.0 Hz</span>
        <span class="s-icon">🔊 Tone</span>
      </button>
    </div>
  </footer>

  <script>
    // --- 1. Embedded PWA Manifest ---
    (function setupPWA() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="110" fill="#0f172a"/>
        <path d="M 96 360 A 180 180 0 0 1 416 360" fill="none" stroke="#334155" stroke-width="32" stroke-linecap="round"/>
        <line x1="256" y1="360" x2="256" y2="120" stroke="#10b981" stroke-width="24" stroke-linecap="round"/>
        <circle cx="256" cy="360" r="32" fill="#f8fafc"/>
      </svg>`;
      const iconUrl = "data:image/svg+xml;utf8," + encodeURIComponent(iconSvg);

      const linkIcon = document.createElement("link");
      linkIcon.rel = "icon";
      linkIcon.href = iconUrl;
      document.head.appendChild(linkIcon);

      const manifest = {
        name: "Cello Tuner",
        short_name: "Cello Tuner",
        start_url: ".",
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#0f172a",
        orientation: "portrait",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
      const linkManifest = document.createElement("link");
      linkManifest.rel = "manifest";
      linkManifest.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(linkManifest);
    })();

    // --- 2. Global Audio References (Prevents GC & Firefox Graph Stalls) ---
    window.audioCtx = null;
    window.globalStream = null;
    window.globalSource = null;
    window.analyser = null;
    window.silentSink = null;
    window.timeBuffer = null;

    const NOTE_NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
    const CELLO_MIDI = [36, 43, 50, 57]; // C2, G2, D3, A3
    const CELLO_LABELS = ["C", "G", "D", "A"];
    const CELLO_OCTAVES = [2, 2, 3, 3];

    let baseA4 = 440;
    let celloLockMode = true;
    let isListening = false;
    let smoothedFreq = 0;
    let lastValidTime = 0;

    // Active Synth State
    let activeDroneIdx = -1;
    let activeSynth = null;

    // DOM Elements
    const startOverlay = document.getElementById("start-overlay");
    const startBtn = document.getElementById("start-btn");
    const errorMsg = document.getElementById("error-msg");
    const micDot = document.getElementById("mic-dot");
    const levelFill = document.getElementById("level-fill");
    const modeBtn = document.getElementById("mode-btn");
    const calBtn = document.getElementById("cal-btn");
    const needle = document.getElementById("needle");
    const needleLine = document.getElementById("needle-line");
    const noteEl = document.getElementById("note-el");
    const centsEl = document.getElementById("cents-el");
    const hzEl = document.getElementById("hz-el");
    const hintEl = document.getElementById("hint-el");
    const stringBtns = document.querySelectorAll(".string-btn");

    function midiToFreq(midi) {
      return baseA4 * Math.pow(2, (midi - 69) / 12);
    }

    function updateStringHzLabels() {
      CELLO_MIDI.forEach((midi, i) => {
        document.getElementById(`str-hz-${i}`).textContent = midiToFreq(midi).toFixed(1) + " Hz";
      });
    }

    function setIdleUI() {
      document.body.classList.remove("in-tune-bg");
      noteEl.classList.remove("in-tune");
      noteEl.textContent = "--";
      centsEl.textContent = "Play a string";
      centsEl.style.color = "var(--muted)";
      hzEl.textContent = "0.0 Hz";
      hintEl.textContent = "";
      needle.style.transform = "rotate(0deg)";
      needleLine.setAttribute("stroke", "#94a3b8");
      stringBtns.forEach(b => b.classList.remove("target-highlight"));
    }

    async function requestWakeLock() {
      if ("wakeLock" in navigator) {
        try { await navigator.wakeLock.request("screen"); } catch (e) {}
      }
    }

    // --- 3. Audio Initialization ---
    startBtn.addEventListener("click", async () => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        window.audioCtx = new AudioCtx();
        if (window.audioCtx.state === "suspended") {
          await window.audioCtx.resume();
        }

        // Fallback-safe microphone request
        try {
          window.globalStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });
        } catch (e) {
          window.globalStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }

        window.globalSource = window.audioCtx.createMediaStreamSource(window.globalStream);

        const lowpass = window.audioCtx.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.value = 900;
        lowpass.Q.value = 0.7;

        window.analyser = window.audioCtx.createAnalyser();
        window.analyser.fftSize = 4096;
        window.timeBuffer = new Float32Array(window.analyser.fftSize);

        // CRITICAL FOR FIREFOX ANDROID: Terminate graph into a 0-gain destination sink
        // so Gecko's audio thread actively pulls frames from the microphone stream.
        window.silentSink = window.audioCtx.createGain();
        window.silentSink.gain.value = 0;

        window.globalSource.connect(lowpass);
        lowpass.connect(window.analyser);
        window.analyser.connect(window.silentSink);
        window.silentSink.connect(window.audioCtx.destination);

        isListening = true;
        micDot.classList.add("active");
        startOverlay.classList.add("hidden");
        requestWakeLock();
        requestAnimationFrame(updateLoop);
      } catch (err) {
        errorMsg.style.display = "block";
        errorMsg.textContent = "Microphone error: " + err.message;
      }
    });

    // --- 4. Verified McLeod Pitch Method (NSDF) with DC Removal & Zero-Crossing Skip ---
    const cleanBuf = new Float32Array(2048);

    function detectPitch(rawBuf, sampleRate) {
      const W = 2048;

      // 1. Remove DC offset (essential on Android raw mic streams)
      let mean = 0;
      for (let i = 0; i < W; i++) mean += rawBuf[i];
      mean /= W;

      let sumSq = 0;
      for (let i = 0; i < W; i++) {
        const v = rawBuf[i] - mean;
        cleanBuf[i] = v;
        sumSq += v * v;
      }
      const rms = Math.sqrt(sumSq / W);

      // Update top-left green audio meter (scaled for raw un-amplified Android mic)
      const pct = Math.min(100, Math.pow(rms * 40, 0.6) * 100);
      levelFill.style.width = `${pct}%`;

      // Low floor gate (-62 dBFS) so quiet strings still register
      if (rms < 0.0008) return -1;

      const minLag = Math.floor(sampleRate / 520);
      const maxLag = Math.min(Math.floor(sampleRate / 52), W - 2);

      // 2. Find first zero-crossing of autocorrelation from tau = 1
      // Ensures we completely exit the lag-0 lobe even for low C2 (65.4 Hz)
      let firstZeroTau = 1;
      while (firstZeroTau < maxLag) {
        let acfCheck = 0;
        for (let i = 0; i < W - firstZeroTau; i += 2) {
          acfCheck += cleanBuf[i] * cleanBuf[i + firstZeroTau];
        }
        if (acfCheck <= 0) break;
        firstZeroTau++;
      }

      const startTau = Math.max(minLag, firstZeroTau);
      if (startTau >= maxLag) return -1;

      const nsdf = new Float32Array(maxLag + 1);
      for (let tau = startTau; tau <= maxLag; tau++) {
        let acf = 0;
        let div = 0;
        const limit = W - tau;
        for (let i = 0; i < limit; i++) {
          const a = cleanBuf[i];
          const b = cleanBuf[i + tau];
          acf += a * b;
          div += a * a + b * b;
        }
        nsdf[tau] = div > 0 ? (2 * acf) / div : 0;
      }

      // 3. Collect positive lobe maxima after the zero crossing
      const peaks = [];
      let inPositiveLobe = false;
      let maxVal = -1;
      let maxTau = 0;

      for (let tau = startTau; tau <= maxLag; tau++) {
        const val = nsdf[tau];
        if (val > 0) {
          if (!inPositiveLobe) {
            inPositiveLobe = true;
            maxVal = val;
            maxTau = tau;
          } else if (val > maxVal) {
            maxVal = val;
            maxTau = tau;
          }
        } else if (inPositiveLobe) {
          peaks.push({ tau: maxTau, val: maxVal });
          inPositiveLobe = false;
        }
      }
      if (inPositiveLobe && maxVal > 0) {
        peaks.push({ tau: maxTau, val: maxVal });
      }

      if (peaks.length === 0) return -1;

      let globalMax = 0;
      for (let i = 0; i < peaks.length; i++) {
        if (peaks[i].val > globalMax) globalMax = peaks[i].val;
      }

      // Periodicity clarity threshold (rejects room chatter / unpitched noise)
      if (globalMax < 0.48) return -1;

      // Pick first peak >= 80% of globalMax to lock onto fundamental (C2) over harmonics
      const threshold = 0.80 * globalMax;
      let chosen = peaks[0];
      for (let i = 0; i < peaks.length; i++) {
        if (peaks[i].val >= threshold) {
          chosen = peaks[i];
          break;
        }
      }

      // 4. Parabolic interpolation for sub-sample precision
      let tau = chosen.tau;
      if (tau > startTau && tau < maxLag) {
        const y0 = nsdf[tau - 1];
        const y1 = nsdf[tau];
        const y2 = nsdf[tau + 1];
        const denom = 2 * y1 - y0 - y2;
        if (Math.abs(denom) > 1e-6) {
          tau = tau + (y2 - y0) / (2 * denom);
        }
      }

      return sampleRate / tau;
    }

    // --- 5. Main Render Loop ---
    function updateLoop(now) {
      requestAnimationFrame(updateLoop);
      if (!isListening || activeDroneIdx !== -1) return;

      window.analyser.getFloatTimeDomainData(window.timeBuffer);
      const rawFreq = detectPitch(window.timeBuffer, window.audioCtx.sampleRate);

      if (rawFreq > 0) {
        lastValidTime = now;
        if (smoothedFreq === 0 || Math.abs(rawFreq - smoothedFreq) / smoothedFreq > 0.07) {
          smoothedFreq = rawFreq;
        } else {
          smoothedFreq = smoothedFreq * 0.72 + rawFreq * 0.28;
        }
        renderPitch(smoothedFreq);
      } else if (smoothedFreq !== 0 && now - lastValidTime > 1200) {
        smoothedFreq = 0;
        setIdleUI();
      }
    }

    function renderPitch(freq) {
      let targetNote = "";
      let targetOctave = 0;
      let targetFreq = 0;
      let closestStringIdx = -1;

      if (celloLockMode) {
        let minCentsDist = Infinity;
        CELLO_MIDI.forEach((midi, idx) => {
          const sFreq = midiToFreq(midi);
          const dist = Math.abs(1200 * Math.log2(freq / sFreq));
          if (dist < minCentsDist) {
            minCentsDist = dist;
            targetFreq = sFreq;
            targetNote = CELLO_LABELS[idx];
            targetOctave = CELLO_OCTAVES[idx];
            closestStringIdx = idx;
          }
        });
      } else {
        const midiFloat = 69 + 12 * Math.log2(freq / baseA4);
        const midiNearest = Math.round(midiFloat);
        targetFreq = midiToFreq(midiNearest);
        targetNote = NOTE_NAMES[((midiNearest % 12) + 12) % 12];
        targetOctave = Math.floor(midiNearest / 12) - 1;
      }

      stringBtns.forEach((btn, idx) => {
        btn.classList.toggle("target-highlight", idx === closestStringIdx);
      });

      const cents = 1200 * Math.log2(freq / targetFreq);
      const clampedCents = Math.max(-50, Math.min(50, cents));
      const angle = (clampedCents / 50) * 75;

      needle.style.transform = `rotate(${angle.toFixed(1)}deg)`;
      noteEl.innerHTML = `${targetNote}<span class="octave-sub">${targetOctave}</span>`;
      hzEl.textContent = `${freq.toFixed(1)} Hz (Target: ${targetFreq.toFixed(1)} Hz)`;

      const roundedCents = Math.round(cents);
      centsEl.textContent = (roundedCents > 0 ? "+" : "") + `${roundedCents} ¢`;

      const absCents = Math.abs(cents);
      if (absCents <= 3.5) {
        document.body.classList.add("in-tune-bg");
        noteEl.classList.add("in-tune");
        needleLine.setAttribute("stroke", "#10b981");
        centsEl.style.color = "#10b981";
        hintEl.textContent = "✓ IN TUNE";
        hintEl.style.color = "#10b981";
      } else {
        document.body.classList.remove("in-tune-bg");
        noteEl.classList.remove("in-tune");
        const color = absCents <= 12 ? "#f59e0b" : "#ef4444";
        needleLine.setAttribute("stroke", color);
        centsEl.style.color = color;
        hintEl.style.color = color;
        hintEl.textContent = cents < 0 ? "▲ Tune Up (Flat)" : "▼ Tune Down (Sharp)";
      }
    }

    // --- 6. Bowed Cello Acoustic Reference Synthesizer (Race-Condition Safe) ---
    modeBtn.addEventListener("click", () => {
      celloLockMode = !celloLockMode;
      modeBtn.textContent = celloLockMode ? "Cello Lock" : "Chromatic";
      modeBtn.classList.toggle("active", celloLockMode);
      if (!celloLockMode) {
        stringBtns.forEach(b => b.classList.remove("target-highlight"));
      }
    });

    calBtn.addEventListener("click", () => {
      baseA4 = baseA4 === 440 ? 442 : 440;
      calBtn.textContent = `A = ${baseA4} Hz`;
      calBtn.classList.toggle("active", baseA4 === 442);
      updateStringHzLabels();
      if (activeDroneIdx !== -1) {
        const idx = activeDroneIdx;
        stopDrone();
        toggleDrone(idx);
      }
    });

    function stopDrone() {
      if (activeSynth && window.audioCtx) {
        // Capture local reference so rapid button switching never kills the new tone
        const synthToStop = activeSynth;
        activeSynth = null;
        const now = window.audioCtx.currentTime;
        try {
          synthToStop.masterGain.gain.cancelScheduledValues(now);
          synthToStop.masterGain.gain.setValueAtTime(synthToStop.masterGain.gain.value, now);
          synthToStop.masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.12);
          setTimeout(() => {
            synthToStop.oscs.forEach(o => { try { o.stop(); o.disconnect(); } catch (e) {} });
            try { synthToStop.masterGain.disconnect(); } catch (e) {}
          }, 150);
        } catch (e) {}
      }
      activeDroneIdx = -1;
      stringBtns.forEach(btn => {
        btn.classList.remove("playing");
        btn.querySelector(".s-icon").textContent = "🔊 Tone";
      });
      setIdleUI();
    }

    async function toggleDrone(idx) {
      if (!window.audioCtx) return;
      if (window.audioCtx.state === "suspended") {
        await window.audioCtx.resume();
      }

      if (activeDroneIdx === idx) {
        stopDrone();
        return;
      }
      stopDrone();

      activeDroneIdx = idx;
      const f0 = midiToFreq(CELLO_MIDI[idx]);
      const now = window.audioCtx.currentTime;

      const masterGain = window.audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.001, now);
      masterGain.gain.linearRampToValueAtTime(0.38, now + 0.22); // Smooth bow attack

      // Cello Body Formant 1: Main wood/cavity warmth (~220 Hz)
      const bodyRes1 = window.audioCtx.createBiquadFilter();
      bodyRes1.type = "peaking";
      bodyRes1.frequency.value = 215;
      bodyRes1.Q.value = 1.4;
      bodyRes1.gain.value = 5;

      // Cello Body Formant 2: Bridge resonance hill (~480 Hz)
      const bodyRes2 = window.audioCtx.createBiquadFilter();
      bodyRes2.type = "peaking";
      bodyRes2.frequency.value = 480;
      bodyRes2.Q.value = 1.8;
      bodyRes2.gain.value = 4;

      // Warm low-pass rolloff to remove harsh digital buzz
      const stringRollOff = window.audioCtx.createBiquadFilter();
      stringRollOff.type = "lowpass";
      stringRollOff.frequency.value = f0 * 6.5;
      stringRollOff.Q.value = 0.7;

      bodyRes1.connect(bodyRes2);
      bodyRes2.connect(stringRollOff);
      stringRollOff.connect(masterGain);
      masterGain.connect(window.audioCtx.destination);

      // Gentle 5 Hz bow vibrato
      const lfo = window.audioCtx.createOscillator();
      const lfoGain = window.audioCtx.createGain();
      lfo.frequency.value = 5.0;
      lfoGain.gain.setValueAtTime(0.01, now);
      lfoGain.gain.linearRampToValueAtTime(f0 * 0.0045, now + 0.6); // Vibrato swells in naturally
      lfo.connect(lfoGain);

      // Dual-detuned sawtooth waves (bowed Helmholtz motion) + fundamental sub-reinforcement
      const oscs = [];
      const voices = [
        { type: "sawtooth", freq: f0, detune: -2.0, gain: 0.45 },
        { type: "sawtooth", freq: f0, detune: +2.0, gain: 0.45 },
        { type: "triangle", freq: f0, detune: 0,    gain: 0.40 },
        { type: "sine",     freq: f0 * 2, detune: 0, gain: 0.25 } // Boost 2nd harmonic for small speakers
      ];

      voices.forEach(v => {
        const osc = window.audioCtx.createOscillator();
        const g = window.audioCtx.createGain();
        osc.type = v.type;
        osc.frequency.setValueAtTime(v.freq, now);
        osc.detune.setValueAtTime(v.detune, now);
        lfoGain.connect(osc.frequency);
        g.gain.value = v.gain;
        osc.connect(g);
        g.connect(bodyRes1);
        osc.start(now);
        oscs.push(osc);
      });

      lfo.start(now);
      oscs.push(lfo);

      activeSynth = { masterGain, oscs };

      // UI State for Reference Tone
      stringBtns[idx].classList.add("playing");
      stringBtns[idx].querySelector(".s-icon").textContent = "⏹ Stop";
      needle.style.transform = "rotate(0deg)";
      needleLine.setAttribute("stroke", "#38bdf8");
      noteEl.innerHTML = `${CELLO_LABELS[idx]}<span class="octave-sub">${CELLO_OCTAVES[idx]}</span>`;
      centsEl.textContent = "Reference Tone Playing";
      centsEl.style.color = "#38bdf8";
      hzEl.textContent = `${f0.toFixed(1)} Hz`;
      hintEl.textContent = "Tap string button again to stop";
      hintEl.style.color = "#94a3b8";
    }

    stringBtns.forEach((btn, idx) => {
      btn.addEventListener("click", () => toggleDrone(idx));
    });

    // --- 7. Service Worker Registration ---
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
